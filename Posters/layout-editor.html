<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Framer — Device Layout Editor</title>
  <link rel="stylesheet" href="styles/poster-system.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #141518;
      color: #F4F5F7;
      font-family: var(--font-sans);
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 310px 1fr 340px;
      grid-template-rows: 60px 1fr;
    }
    .topbar {
      grid-column: 1 / -1;
      background: #1B1D22;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 15px;
    }
    .topbar-dot {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      background: var(--primary);
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      background: rgba(255,255,255,0.08);
      color: #FFFFFF;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 7px 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover:not(:disabled) { background: rgba(255,255,255,0.16); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn--primary { background: var(--primary); border-color: var(--primary); }
    .btn--primary:hover:not(:disabled) { background: #e0611d; }
    .btn--danger { color: #FF6B62; border-color: rgba(255, 88, 77, 0.35); }
    .btn--danger:hover:not(:disabled) { background: rgba(255, 88, 77, 0.2); }

    .sidebar {
      background: #181A1F;
      border-right: 1px solid rgba(255,255,255,0.08);
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .inspector {
      background: #181A1F;
      border-left: 1px solid rgba(255,255,255,0.08);
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .section-title {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9FA4B0;
      margin-bottom: 8px;
    }
    .layout-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .layout-item {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .layout-item:hover { background: rgba(255,255,255,0.08); }
    .layout-item.active {
      background: rgba(243, 110, 37, 0.14);
      border-color: var(--primary);
    }
    .layout-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
    }
    .layout-item-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: #9FA4B0;
    }

    .stage-wrap {
      background: #101114;
      display: flex;
      padding: 28px;
      overflow: auto;
      position: relative;
    }
    .editor-canvas {
      background: #FFFFFF;
      position: relative;
      margin: auto;
      flex-shrink: 0;
      box-shadow: 0 24px 64px rgba(0,0,0,0.55);
      border-radius: 8px;
      overflow: hidden;
      user-select: none;
    }
    .canvas-grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(0,0,0,0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .frame-node {
      position: absolute;
      cursor: move;
      transform-origin: center center;
    }
    .frame-overall {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      border: 2px solid #242529;
      background: rgba(36, 37, 41, 0.14);
      transition: border-color 0.12s ease;
    }
    .frame-node.has-bezel .frame-overall {
      background: rgba(36, 37, 41, 0.85);
      border-color: #242529;
      box-shadow: 0 10px 24px rgba(0,0,0,0.22);
    }
    .frame-node.selected .frame-overall {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(243, 110, 37, 0.45);
    }
    .frame-screen {
      position: absolute;
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px dashed var(--primary);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4px;
      color: #242529;
      pointer-events: none;
    }
    .frame-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
    }
    .frame-dims {
      font-family: var(--font-mono);
      font-size: 9px;
      color: #606363;
      margin-top: 2px;
    }

    /* Figma-style Option/Alt distance measurement overlay */
    .measure-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }
    .measure-target-box {
      position: absolute;
      border: 1.5px solid #F24822;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .measure-line-h {
      position: absolute;
      height: 1px;
      background: #F24822;
      transform: translateY(-0.5px);
    }
    .measure-line-h::before,
    .measure-line-h::after {
      content: '';
      position: absolute;
      top: -3px;
      width: 1px;
      height: 7px;
      background: #F24822;
    }
    .measure-line-h::before { left: 0; }
    .measure-line-h::after { right: 0; }
    .measure-line-v {
      position: absolute;
      width: 1px;
      background: #F24822;
      transform: translateX(-0.5px);
    }
    .measure-line-v::before,
    .measure-line-v::after {
      content: '';
      position: absolute;
      left: -3px;
      width: 7px;
      height: 1px;
      background: #F24822;
    }
    .measure-line-v::before { top: 0; }
    .measure-line-v::after { bottom: 0; }
    .measure-ext-h {
      position: absolute;
      height: 0;
      border-top: 1px dashed rgba(242, 72, 34, 0.65);
    }
    .measure-ext-v {
      position: absolute;
      width: 0;
      border-left: 1px dashed rgba(242, 72, 34, 0.65);
    }
    .measure-pill {
      position: absolute;
      transform: translate(-50%, -50%);
      background: #F24822;
      color: #FFFFFF;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      padding: 3px 5px;
      border-radius: 4px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.28);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: #9FA4B0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    input, select, textarea {
      background: #111216;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      color: #FFFFFF;
      padding: 7px 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    .size-readout {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .size-row {
      display: flex;
      justify-content: space-between;
    }
    .size-row span:last-child { color: var(--primary); font-weight: 700; }
    .lock-banner {
      padding: 8px 10px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.35;
    }
    .lock-banner--locked {
      background: rgba(251, 201, 102, 0.14);
      border: 1px solid rgba(251, 201, 102, 0.4);
      color: #FBC966;
    }
    .lock-banner--unlocked {
      background: rgba(107, 199, 133, 0.14);
      border: 1px solid rgba(107, 199, 133, 0.4);
      color: #6BC785;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #242529;
      border: 1px solid var(--primary);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-dot"></span>
      <span>Portfolio Framer — Device Layout Editor</span>
    </div>
    <div class="topbar-actions">
      <button class="btn" id="btn-zoom-out" title="Zoom Out (⌘- / Ctrl+-)">−</button>
      <button class="btn" id="btn-zoom-reset" title="Reset Zoom to Fit (⌘0 / Ctrl+0)" style="min-width:62px;">100%</button>
      <button class="btn" id="btn-zoom-in" title="Zoom In (⌘+ / Ctrl++)">+</button>
      <button class="btn" id="btn-undo" title="Undo (⌘Z / Ctrl+Z)" disabled>↶ Undo</button>
      <button class="btn" id="btn-redo" title="Redo (⌘⇧Z / Ctrl+Y)" disabled>↷ Redo</button>
      <button class="btn" id="btn-new-layout">+ New Layout</button>
      <button class="btn" id="btn-dup-layout">Duplicate</button>
      <button class="btn btn--danger" id="btn-del-layout">Delete</button>
      <button class="btn btn--primary" id="btn-save-layout">Build &amp; Save Layout</button>
    </div>
  </header>

  <aside class="sidebar">
    <div>
      <div class="section-title">Saved Layouts</div>
      <div class="layout-list" id="layout-list"></div>
    </div>

    <div class="field-group">
      <div class="section-title">Layout Properties</div>
      <label>Layout ID
        <input id="inp-id" type="text" />
      </label>
      <label>Display Label
        <input id="inp-label" type="text" />
      </label>
      <div class="field-row">
        <label>Canvas W (px)
          <input id="inp-cw" type="number" step="10" />
        </label>
        <label>Canvas H (px)
          <input id="inp-ch" type="number" step="10" />
        </label>
      </div>
      <label>Summary
        <textarea id="inp-summary" rows="2"></textarea>
      </label>
      <label>Agent Guidance
        <textarea id="inp-guidance" rows="3"></textarea>
      </label>
    </div>
  </aside>

  <main class="stage-wrap" id="stage-wrap" style="position:relative;">
    <div class="editor-canvas" id="editor-canvas">
      <div class="canvas-grid-bg"></div>
      <div class="measure-overlay" id="measure-overlay"></div>
    </div>
  </main>

  <aside class="inspector">
    <div>
      <div class="section-title">Add Device to Layout</div>
      <div class="field-row">
        <select id="sel-add-device">
          <option value="iphone-17-pro">iPhone 17 Pro</option>
          <option value="ipad-pro-m4-11-portrait">iPad Pro 11" Portrait</option>
          <option value="ipad-pro-m4-11-landscape">iPad Pro 11" Landscape</option>
          <option value="browser">Browser (16:9)</option>
          <option value="app-icon">App Icon (Squircle)</option>
        </select>
        <button class="btn btn--primary" id="btn-add-frame">+ Add</button>
      </div>
    </div>

    <div id="frame-inspector" style="display: none; flex-direction: column; gap: 14px;">
      <div class="section-title">Selected Device Slot #<span id="slot-num">0</span></div>

      <div id="bezel-lock-banner" class="lock-banner"></div>

      <div class="size-readout">
        <div class="size-row">
          <span>Screen Size:</span>
          <span id="readout-screen">—</span>
        </div>
        <div class="size-row">
          <span>Overall Size:</span>
          <span id="readout-overall">—</span>
        </div>
      </div>

      <label>Device Type
        <select id="inp-f-device">
          <option value="iphone-17-pro">iPhone 17 Pro</option>
          <option value="ipad-pro-m4-11-portrait">iPad Pro 11" Portrait</option>
          <option value="ipad-pro-m4-11-landscape">iPad Pro 11" Landscape</option>
          <option value="browser">Browser (16:9)</option>
          <option value="app-icon">App Icon (Squircle)</option>
          <option value="app-icon-circle">App Icon (Circle)</option>
        </select>
      </label>

      <div class="field-row">
        <label>Bezel State
          <button class="btn" id="btn-toggle-bezel" type="button">Bezel: ON</button>
        </label>
        <label>Rotation
          <select id="inp-f-rot">
            <option value="0">0°</option>
            <option value="90">90°</option>
          </select>
        </label>
      </div>

      <div class="field-row">
        <label>Screen X (px)
          <input id="inp-f-x" type="number" />
        </label>
        <label>Screen Y (px)
          <input id="inp-f-y" type="number" />
        </label>
      </div>

      <label>Screen Width (px)
        <input id="inp-f-w" type="number" min="80" />
      </label>

      <div class="field-row">
        <button class="btn" id="btn-center-h" type="button">Center X</button>
        <button class="btn" id="btn-center-v" type="button">Center Y</button>
      </div>

      <div class="field-row">
        <button class="btn" id="btn-copy-frame" type="button" title="Copy Device (⌘C / Ctrl+C)">Copy Device</button>
        <button class="btn" id="btn-paste-frame" type="button" title="Paste Device (⌘V / Ctrl+V)" disabled>Paste Device</button>
      </div>

      <button class="btn btn--danger" id="btn-del-frame" type="button">Remove Device Slot</button>
    </div>

    <div id="no-selection-hint" style="font-size: 13px; color: #9FA4B0; line-height: 1.5;">
      Click any device on the canvas to inspect its <strong>Screen Size</strong> vs. <strong>Overall Size</strong>, reposition it, or add new devices.
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script>
    // Exact device geometry matching Posters/framer/mcp.mjs
    const DEVICES = {
      'iphone-17-pro': {
        label: 'iPhone 17 Pro',
        screenW: 1206, screenH: 2622,
        frameW: 450, frameH: 920,
        rect: { x: 24, y: 23, w: 402, h: 874 },
        canBezel: true
      },
      'ipad-pro-m4-11-portrait': {
        label: 'iPad Portrait',
        screenW: 1668, screenH: 2420,
        frameW: 940, frameH: 1320,
        rect: { x: 53, y: 55, w: 834, h: 1210 },
        canBezel: true
      },
      'ipad-pro-m4-11-landscape': {
        label: 'iPad Landscape',
        screenW: 2420, screenH: 1668,
        frameW: 1320, frameH: 940,
        rect: { x: 55, y: 53, w: 1210, h: 834 },
        canBezel: true
      },
      'browser': {
        label: 'Browser',
        screenW: 1920, screenH: 1080,
        frameW: 1960, frameH: 1174,
        rect: { x: 20, y: 84, w: 1920, h: 1080 },
        canBezel: true
      },
      'app-icon': {
        label: 'App Icon',
        screenW: 1024, screenH: 1024,
        frameW: 1024, frameH: 1024,
        rect: { x: 0, y: 0, w: 1024, h: 1024 },
        canBezel: false
      },
      'app-icon-circle': {
        label: 'App Icon (Circle)',
        screenW: 1024, screenH: 1024,
        frameW: 1024, frameH: 1024,
        rect: { x: 0, y: 0, w: 1024, h: 1024 },
        canBezel: false
      }
    };

    let layouts = [];
    let currentLayout = null;
    let selectedSlotIdx = null;
    let canvasScale = 1;
    let zoomFactor = 1;
    let copiedFrame = null;
    let pasteCount = 0;
    let history = [];
    let historyIdx = -1;

    function setZoom(nextZoom) {
      zoomFactor = Math.min(4, Math.max(0.25, Math.round(nextZoom * 100) / 100));
      const btn = document.getElementById('btn-zoom-reset');
      if (btn) btn.textContent = `${Math.round(zoomFactor * 100)}%`;
      renderCanvas();
    }

    function copySelectedFrame() {
      if (!currentLayout || selectedSlotIdx === null || !currentLayout.frames[selectedSlotIdx]) return;
      copiedFrame = JSON.parse(JSON.stringify(currentLayout.frames[selectedSlotIdx]));
      pasteCount = 0;
      const btnPaste = document.getElementById('btn-paste-frame');
      if (btnPaste) btnPaste.disabled = false;
      showToast(`Copied #${selectedSlotIdx + 1} ${DEVICES[copiedFrame.deviceId]?.label || copiedFrame.deviceId}`);
    }

    function pasteFrame() {
      if (!currentLayout || !copiedFrame) return;
      pasteCount += 1;
      const clone = JSON.parse(JSON.stringify(copiedFrame));
      clone.x = Math.round((clone.x || 0) + 40 * pasteCount);
      clone.y = Math.round((clone.y || 0) + 40 * pasteCount);
      currentLayout.frames.push(clone);
      selectedSlotIdx = currentLayout.frames.length - 1;
      renderCanvas();
      syncInspector();
      pushHistory();
      showToast(`Pasted ${DEVICES[clone.deviceId]?.label || clone.deviceId}`);
    }

    function syncUndoRedoButtons() {
      const btnU = document.getElementById('btn-undo');
      const btnR = document.getElementById('btn-redo');
      if (btnU) btnU.disabled = historyIdx <= 0;
      if (btnR) btnR.disabled = historyIdx < 0 || historyIdx >= history.length - 1;
    }

    function resetHistory() {
      history = currentLayout ? [JSON.stringify(currentLayout)] : [];
      historyIdx = history.length - 1;
      syncUndoRedoButtons();
    }

    function pushHistory() {
      if (!currentLayout) return;
      const snap = JSON.stringify(currentLayout);
      if (historyIdx >= 0 && history[historyIdx] === snap) return;
      history = history.slice(0, historyIdx + 1);
      history.push(snap);
      if (history.length > 100) history.shift();
      historyIdx = history.length - 1;
      syncUndoRedoButtons();
    }

    function applyHistoryAt(idx) {
      if (idx < 0 || idx >= history.length) return;
      historyIdx = idx;
      currentLayout = JSON.parse(history[historyIdx]);
      if (selectedSlotIdx !== null && (!currentLayout.frames || selectedSlotIdx >= currentLayout.frames.length)) {
        selectedSlotIdx = currentLayout.frames.length > 0 ? 0 : null;
      }
      syncLayoutFields();
      renderCanvas();
      syncInspector();
      syncUndoRedoButtons();
    }

    function undo() {
      if (historyIdx > 0) applyHistoryAt(historyIdx - 1);
    }

    function redo() {
      if (historyIdx < history.length - 1) applyHistoryAt(historyIdx + 1);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    /**
     * Computes BOTH Screen Size and Overall Size (larger when bezel is ON)
     */
    function computeMetrics(frame) {
      const d = DEVICES[frame.deviceId] || DEVICES['iphone-17-pro'];
      const screenW = frame.width;
      const screenH = screenW * (d.screenH / d.screenW);
      const hasBezel = d.canBezel && Boolean(frame.showDeviceFrame);

      let padL = 0, padT = 0, overallW = screenW, overallH = screenH;
      if (hasBezel) {
        const scaleX = screenW / d.rect.w;
        const scaleY = screenH / d.rect.h;
        padL = d.rect.x * scaleX;
        padT = d.rect.y * scaleY;
        overallW = d.frameW * scaleX;
        overallH = d.frameH * scaleY;
      }
      return { screenW, screenH, overallW, overallH, padL, padT, hasBezel };
    }

    async function loadDevices() {
      try {
        const resp = await fetch('/api/devices');
        const list = await resp.json();
        if (Array.isArray(list)) {
          for (const d of list) {
            DEVICES[d.id] = {
              label: d.name || d.id,
              kind: d.kind || 'other',
              screenW: d.screenW,
              screenH: d.screenH,
              frameW: d.frameNativeW || d.screenW,
              frameH: d.frameNativeH || d.screenH,
              rect: d.screenRect || { x: 0, y: 0, w: d.screenW, h: d.screenH },
              frameImage: d.frameImage || null,
              canBezel: d.kind !== 'icon' && d.kind !== 'shape'
            };
          }
        }
      } catch (e) {
        console.warn('Could not load /api/devices, using built-in defaults', e);
      }
      populateDeviceSelects();
    }

    function populateDeviceSelects() {
      const groups = [
        ['iPhone', (id, d) => d.kind === 'phone'],
        ['iPad', (id, d) => d.kind === 'tablet'],
        ['MacBook', (id, d) => d.kind === 'laptop'],
        ['Desktop & Display', (id, d) => d.kind === 'desktop'],
        ['Apple Watch', (id, d) => d.kind === 'watch'],
        ['Apple TV', (id, d) => d.kind === 'tv'],
        ['Browser & Icons', (id, d) => !['phone','tablet','laptop','desktop','watch','tv'].includes(d.kind)]
      ];
      for (const selId of ['sel-add-device', 'inp-f-device']) {
        const sel = document.getElementById(selId);
        if (!sel) continue;
        const prev = sel.value;
        sel.innerHTML = '';
        for (const [groupLabel, pred] of groups) {
          const entries = Object.entries(DEVICES).filter(([id, d]) => pred(id, d));
          if (!entries.length) continue;
          const og = document.createElement('optgroup');
          og.label = groupLabel;
          for (const [id, d] of entries) {
            const opt = document.createElement('option');
            opt.value = id;
            opt.textContent = d.label;
            og.appendChild(opt);
          }
          sel.appendChild(og);
        }
        if (prev && DEVICES[prev]) sel.value = prev;
      }
    }

    async function loadLayouts() {
      await loadDevices();
      const resp = await fetch('/api/layouts');
      layouts = await resp.json();
      if (!currentLayout && layouts.length > 0) {
        selectLayout(layouts[0]);
      } else {
        renderLayoutList();
      }
    }

    function selectLayout(l) {
      currentLayout = JSON.parse(JSON.stringify(l));
      selectedSlotIdx = currentLayout.frames.length > 0 ? 0 : null;
      resetHistory();
      syncLayoutFields();
      renderLayoutList();
      renderCanvas();
      syncInspector();
    }

    function syncLayoutFields() {
      if (!currentLayout) return;
      document.getElementById('inp-id').value = currentLayout.id || '';
      document.getElementById('inp-label').value = currentLayout.label || '';
      document.getElementById('inp-cw').value = currentLayout.intrinsicWidth || 2400;
      document.getElementById('inp-ch').value = currentLayout.intrinsicHeight || 2400;
      document.getElementById('inp-summary').value = currentLayout.summary || '';
      document.getElementById('inp-guidance').value = currentLayout.guidance || '';
    }

    function renderLayoutList() {
      const list = document.getElementById('layout-list');
      list.innerHTML = '';
      layouts.forEach((l) => {
        const div = document.createElement('div');
        div.className = 'layout-item' + (currentLayout && currentLayout.id === l.id ? ' active' : '');
        div.innerHTML = `
          <div class="layout-item-top">
            <span>${l.label || l.id}</span>
            <span>${l.locked ? '🔒' : '🔓'}</span>
          </div>
          <div class="layout-item-meta">${l.id} • ${l.frames.length} slot(s) • ${l.intrinsicWidth}×${l.intrinsicHeight}</div>
        `;
        div.onclick = () => selectLayout(l);
        list.appendChild(div);
      });
    }

    function renderCanvas() {
      const wrap = document.getElementById('stage-wrap');
      const canvas = document.getElementById('editor-canvas');
      if (!currentLayout) return;

      const cw = currentLayout.intrinsicWidth || 2400;
      const ch = currentLayout.intrinsicHeight || 2400;
      const maxW = wrap.clientWidth - 56;
      const maxH = wrap.clientHeight - 56;
      const fitScale = Math.min(maxW / cw, maxH / ch, 1);
      canvasScale = fitScale * zoomFactor;

      canvas.style.width = `${cw * canvasScale}px`;
      canvas.style.height = `${ch * canvasScale}px`;

      canvas.querySelectorAll('.frame-node').forEach((n) => n.remove());

      currentLayout.frames.forEach((f, idx) => {
        const m = computeMetrics(f);
        const node = document.createElement('div');
        node.className = 'frame-node' + (m.hasBezel ? ' has-bezel' : '') + (selectedSlotIdx === idx ? ' selected' : '');
        // f.x, f.y are center coordinates in Portfolio Framer
        node.style.left = `${(f.x - m.overallW / 2) * canvasScale}px`;
        node.style.top = `${(f.y - m.overallH / 2) * canvasScale}px`;
        node.style.width = `${m.overallW * canvasScale}px`;
        node.style.height = `${m.overallH * canvasScale}px`;
        node.style.transform = `rotate(${f.rotation || 0}deg)`;

        const overallDiv = document.createElement('div');
        overallDiv.className = 'frame-overall';
        const dev = DEVICES[f.deviceId];
        if (m.hasBezel && dev?.frameImage) {
          overallDiv.style.background = 'transparent';
          overallDiv.style.borderColor = 'transparent';
          const img = document.createElement('img');
          img.src = dev.frameImage;
          img.draggable = false;
          img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;';
          overallDiv.appendChild(img);
        }

        const screenDiv = document.createElement('div');
        screenDiv.className = 'frame-screen';
        screenDiv.style.left = `${m.padL * canvasScale}px`;
        screenDiv.style.top = `${m.padT * canvasScale}px`;
        screenDiv.style.width = `${m.screenW * canvasScale}px`;
        screenDiv.style.height = `${m.screenH * canvasScale}px`;
        screenDiv.innerHTML = `
          <div class="frame-label">#${idx + 1} ${DEVICES[f.deviceId]?.label || f.deviceId}</div>
          <div class="frame-dims">Scr: ${Math.round(m.screenW)}×${Math.round(m.screenH)}<br/>All: ${Math.round(m.overallW)}×${Math.round(m.overallH)}</div>
        `;

        node.appendChild(overallDiv);
        node.appendChild(screenDiv);

        node.addEventListener('mousedown', (e) => {
          e.stopPropagation();
          selectedSlotIdx = idx;
          renderCanvas();
          syncInspector();

          const startX = e.clientX;
          const startY = e.clientY;
          const origX = f.x;
          const origY = f.y;

          const onMove = (me) => {
            f.x = Math.round(origX + (me.clientX - startX) / canvasScale);
            f.y = Math.round(origY + (me.clientY - startY) / canvasScale);
            renderCanvas();
            syncInspector();
          };
          const onUp = () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            if (f.x !== origX || f.y !== origY) pushHistory();
          };
          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onUp);
        });

        canvas.appendChild(node);
      });
      renderMeasureGuides();
    }

    function syncInspector() {
      const insp = document.getElementById('frame-inspector');
      const hint = document.getElementById('no-selection-hint');
      if (!currentLayout || selectedSlotIdx === null || !currentLayout.frames[selectedSlotIdx]) {
        insp.style.display = 'none';
        hint.style.display = 'block';
        return;
      }
      insp.style.display = 'flex';
      hint.style.display = 'none';

      const f = currentLayout.frames[selectedSlotIdx];
      const m = computeMetrics(f);
      document.getElementById('slot-num').textContent = selectedSlotIdx + 1;
      document.getElementById('readout-screen').textContent = `${Math.round(m.screenW)} × ${Math.round(m.screenH)} px`;
      document.getElementById('readout-overall').textContent = `${Math.round(m.overallW)} × ${Math.round(m.overallH)} px`;
      document.getElementById('inp-f-device').value = f.deviceId;
      document.getElementById('inp-f-rot').value = String(f.rotation || 0);
      document.getElementById('inp-f-x').value = f.x;
      document.getElementById('inp-f-y').value = f.y;
      document.getElementById('inp-f-w').value = f.width;

      const bezelBtn = document.getElementById('btn-toggle-bezel');
      const banner = document.getElementById('bezel-lock-banner');
      const isLocked = Boolean(currentLayout.locked);
      const canBezel = DEVICES[f.deviceId]?.canBezel;

      bezelBtn.textContent = `Bezel: ${m.hasBezel ? 'ON' : 'OFF'}`;
      bezelBtn.disabled = isLocked || !canBezel;

      if (isLocked) {
        banner.className = 'lock-banner lock-banner--locked';
        banner.textContent = '🔒 Bezel locked: This layout is already built. Duplicate it to build a variant with different bezels.';
      } else {
        banner.className = 'lock-banner lock-banner--unlocked';
        banner.textContent = '🔓 Draft mode: Toggle Bezel ON/OFF freely—Overall Size updates live before saving.';
      }
    }

    // Event Bindings
    document.getElementById('btn-undo').onclick = undo;
    document.getElementById('btn-redo').onclick = redo;

    ['inp-id', 'inp-label', 'inp-cw', 'inp-ch', 'inp-summary', 'inp-guidance'].forEach((id) => {
      document.getElementById(id).addEventListener('input', () => {
        if (!currentLayout) return;
        currentLayout.id = document.getElementById('inp-id').value.trim();
        currentLayout.label = document.getElementById('inp-label').value;
        currentLayout.intrinsicWidth = Number(document.getElementById('inp-cw').value) || 2400;
        currentLayout.intrinsicHeight = Number(document.getElementById('inp-ch').value) || 2400;
        currentLayout.summary = document.getElementById('inp-summary').value;
        currentLayout.guidance = document.getElementById('inp-guidance').value;
        renderCanvas();
        pushHistory();
      });
    });

    document.getElementById('btn-add-frame').onclick = () => {
      if (!currentLayout) return;
      const devId = document.getElementById('sel-add-device').value;
      const dev = DEVICES[devId];
      const defaultW = dev?.kind === 'tablet' ? 900 : ['laptop', 'desktop', 'tv', 'browser'].includes(dev?.kind) ? 1400 : dev?.kind === 'watch' ? 280 : 402;
      currentLayout.frames.push({
        deviceId: devId,
        x: Math.round(currentLayout.intrinsicWidth / 2),
        y: Math.round(currentLayout.intrinsicHeight / 2),
        width: defaultW,
        rotation: 0,
        showDeviceFrame: dev?.canBezel ? true : false
      });
      selectedSlotIdx = currentLayout.frames.length - 1;
      renderCanvas();
      syncInspector();
      pushHistory();
    };

    document.getElementById('btn-toggle-bezel').onclick = () => {
      if (!currentLayout || currentLayout.locked || selectedSlotIdx === null) return;
      const f = currentLayout.frames[selectedSlotIdx];
      f.showDeviceFrame = !f.showDeviceFrame;
      renderCanvas();
      syncInspector();
      pushHistory();
    };

    ['inp-f-device', 'inp-f-rot', 'inp-f-x', 'inp-f-y', 'inp-f-w'].forEach((id) => {
      document.getElementById(id).addEventListener('input', () => {
        if (!currentLayout || selectedSlotIdx === null) return;
        const f = currentLayout.frames[selectedSlotIdx];
        f.deviceId = document.getElementById('inp-f-device').value;
        f.rotation = Number(document.getElementById('inp-f-rot').value) || 0;
        f.x = Number(document.getElementById('inp-f-x').value) || 0;
        f.y = Number(document.getElementById('inp-f-y').value) || 0;
        f.width = Math.max(80, Number(document.getElementById('inp-f-w').value) || 400);
        renderCanvas();
        syncInspector();
        pushHistory();
      });
    });

    document.getElementById('btn-center-h').onclick = () => {
      if (!currentLayout || selectedSlotIdx === null) return;
      const f = currentLayout.frames[selectedSlotIdx];
      f.x = Math.round(currentLayout.intrinsicWidth / 2);
      renderCanvas();
      syncInspector();
      pushHistory();
    };

    document.getElementById('btn-center-v').onclick = () => {
      if (!currentLayout || selectedSlotIdx === null) return;
      const f = currentLayout.frames[selectedSlotIdx];
      f.y = Math.round(currentLayout.intrinsicHeight / 2);
      renderCanvas();
      syncInspector();
      pushHistory();
    };

    document.getElementById('btn-del-frame').onclick = () => {
      if (!currentLayout || selectedSlotIdx === null) return;
      currentLayout.frames.splice(selectedSlotIdx, 1);
      selectedSlotIdx = currentLayout.frames.length > 0 ? 0 : null;
      renderCanvas();
      syncInspector();
      pushHistory();
    };

    document.getElementById('btn-new-layout').onclick = () => {
      const draft = {
        id: `custom-${Date.now().toString().slice(-4)}`,
        label: 'New Custom Layout',
        intrinsicWidth: 1968,
        intrinsicHeight: 1100,
        purposes: ['feature'],
        summary: 'Custom device composition.',
        guidance: 'Use for custom product showcase frames.',
        locked: false,
        frames: [
          { deviceId: 'iphone-17-pro', x: 783, y: 113, width: 402, rotation: 0, showDeviceFrame: true }
        ]
      };
      selectLayout(draft);
      showToast('Created unlocked draft — toggle bezels freely, then Build & Save.');
    };

    document.getElementById('btn-dup-layout').onclick = () => {
      if (!currentLayout) return;
      const copy = JSON.parse(JSON.stringify(currentLayout));
      copy.id = `${currentLayout.id}-copy`;
      copy.label = `${currentLayout.label} (Copy)`;
      copy.locked = false;
      selectLayout(copy);
      showToast('Duplicated as unlocked draft — bezels can now be edited.');
    };

    document.getElementById('btn-save-layout').onclick = async () => {
      if (!currentLayout || !currentLayout.id) return;
      const resp = await fetch('/api/layouts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(currentLayout)
      });
      const data = await resp.json();
      if (data.ok) {
        layouts = data.layouts;
        currentLayout.locked = true;
        renderLayoutList();
        syncInspector();
        showToast(`Built & locked layout "${currentLayout.id}"!`);
      }
    };

    document.getElementById('btn-del-layout').onclick = async () => {
      if (!currentLayout || !currentLayout.id) return;
      const resp = await fetch(`/api/layouts/${encodeURIComponent(currentLayout.id)}`, { method: 'DELETE' });
      const data = await resp.json();
      if (data.ok) {
        layouts = data.layouts;
        currentLayout = null;
        if (layouts.length > 0) selectLayout(layouts[0]);
        else { renderLayoutList(); renderCanvas(); syncInspector(); }
        showToast('Deleted layout.');
      }
    };

    let lastPointer = null;
    let isAltPressed = false;

    function getFrameAABB(f) {
      const m = computeMetrics(f);
      const rad = ((f.rotation || 0) * Math.PI) / 180;
      const cos = Math.abs(Math.cos(rad));
      const sin = Math.abs(Math.sin(rad));
      const w = m.overallW * cos + m.overallH * sin;
      const h = m.overallW * sin + m.overallH * cos;
      return {
        left: f.x - w / 2,
        right: f.x + w / 2,
        top: f.y - h / 2,
        bottom: f.y + h / 2,
        cx: f.x,
        cy: f.y,
        w,
        h
      };
    }

    function pointInFrame(px, py, f) {
      const m = computeMetrics(f);
      const dx = px - f.x;
      const dy = py - f.y;
      const rad = -((f.rotation || 0) * Math.PI) / 180;
      const lx = dx * Math.cos(rad) - dy * Math.sin(rad);
      const ly = dx * Math.sin(rad) + dy * Math.cos(rad);
      return Math.abs(lx) <= m.overallW / 2 && Math.abs(ly) <= m.overallH / 2;
    }

    function addHMeasure(overlay, x1, x2, y) {
      const minX = Math.min(x1, x2);
      const maxX = Math.max(x1, x2);
      const dist = Math.round(maxX - minX);
      if (dist <= 0) return;

      const line = document.createElement('div');
      line.className = 'measure-line-h';
      line.style.left = `${minX * canvasScale}px`;
      line.style.top = `${y * canvasScale}px`;
      line.style.width = `${(maxX - minX) * canvasScale}px`;
      overlay.appendChild(line);

      const pill = document.createElement('div');
      pill.className = 'measure-pill';
      pill.textContent = `${dist}px`;
      pill.style.left = `${((minX + maxX) / 2) * canvasScale}px`;
      pill.style.top = `${y * canvasScale}px`;
      overlay.appendChild(pill);
    }

    function addVMeasure(overlay, x, y1, y2) {
      const minY = Math.min(y1, y2);
      const maxY = Math.max(y1, y2);
      const dist = Math.round(maxY - minY);
      if (dist <= 0) return;

      const line = document.createElement('div');
      line.className = 'measure-line-v';
      line.style.left = `${x * canvasScale}px`;
      line.style.top = `${minY * canvasScale}px`;
      line.style.height = `${(maxY - minY) * canvasScale}px`;
      overlay.appendChild(line);

      const pill = document.createElement('div');
      pill.className = 'measure-pill';
      pill.textContent = `${dist}px`;
      pill.style.left = `${x * canvasScale}px`;
      pill.style.top = `${((minY + maxY) / 2) * canvasScale}px`;
      overlay.appendChild(pill);
    }

    function addExtH(overlay, x1, x2, y) {
      const minX = Math.min(x1, x2);
      const maxX = Math.max(x1, x2);
      if (maxX - minX <= 0.5) return;
      const ext = document.createElement('div');
      ext.className = 'measure-ext-h';
      ext.style.left = `${minX * canvasScale}px`;
      ext.style.top = `${y * canvasScale}px`;
      ext.style.width = `${(maxX - minX) * canvasScale}px`;
      overlay.appendChild(ext);
    }

    function addExtV(overlay, x, y1, y2) {
      const minY = Math.min(y1, y2);
      const maxY = Math.max(y1, y2);
      if (maxY - minY <= 0.5) return;
      const ext = document.createElement('div');
      ext.className = 'measure-ext-v';
      ext.style.left = `${x * canvasScale}px`;
      ext.style.top = `${minY * canvasScale}px`;
      ext.style.height = `${(maxY - minY) * canvasScale}px`;
      overlay.appendChild(ext);
    }

    function renderMeasureGuides() {
      const overlay = document.getElementById('measure-overlay');
      const canvas = document.getElementById('editor-canvas');
      if (!overlay || !canvas) return;
      overlay.innerHTML = '';

      if (!isAltPressed || !lastPointer || !currentLayout || selectedSlotIdx === null || !currentLayout.frames[selectedSlotIdx]) {
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const cw = currentLayout.intrinsicWidth || 2400;
      const ch = currentLayout.intrinsicHeight || 2400;
      const px = (lastPointer.clientX - rect.left) / canvasScale;
      const py = (lastPointer.clientY - rect.top) / canvasScale;

      if (px < 0 || py < 0 || px > cw || py > ch) return;

      // Hit-test topmost frame under cursor
      let hitIdx = -1;
      for (let i = currentLayout.frames.length - 1; i >= 0; i--) {
        if (pointInFrame(px, py, currentLayout.frames[i])) {
          hitIdx = i;
          break;
        }
      }

      const sel = getFrameAABB(currentLayout.frames[selectedSlotIdx]);

      // Hovering empty canvas or the selected frame itself -> measure to canvas edges
      if (hitIdx === -1 || hitIdx === selectedSlotIdx) {
        if (sel.top > 0) addVMeasure(overlay, sel.cx, 0, sel.top);
        if (ch - sel.bottom > 0) addVMeasure(overlay, sel.cx, sel.bottom, ch);
        if (sel.left > 0) addHMeasure(overlay, 0, sel.left, sel.cy);
        if (cw - sel.right > 0) addHMeasure(overlay, sel.right, cw, sel.cy);
        return;
      }

      // Hovering another device -> highlight target & measure gaps/edges
      const tgt = getFrameAABB(currentLayout.frames[hitIdx]);
      const box = document.createElement('div');
      box.className = 'measure-target-box';
      box.style.left = `${tgt.left * canvasScale}px`;
      box.style.top = `${tgt.top * canvasScale}px`;
      box.style.width = `${tgt.w * canvasScale}px`;
      box.style.height = `${tgt.h * canvasScale}px`;
      overlay.appendChild(box);

      const yOverlapStart = Math.max(sel.top, tgt.top);
      const yOverlapEnd = Math.min(sel.bottom, tgt.bottom);
      const xOverlapStart = Math.max(sel.left, tgt.left);
      const xOverlapEnd = Math.min(sel.right, tgt.right);
      const hasYOverlap = yOverlapStart <= yOverlapEnd;
      const hasXOverlap = xOverlapStart <= xOverlapEnd;

      // Horizontal gap
      if (sel.right < tgt.left || tgt.right < sel.left) {
        const lineY = hasYOverlap ? (yOverlapStart + yOverlapEnd) / 2 : sel.cy;
        const xFrom = sel.right < tgt.left ? sel.right : tgt.right;
        const xTo = sel.right < tgt.left ? tgt.left : sel.left;
        addHMeasure(overlay, xFrom, xTo, lineY);
        if (!hasYOverlap) {
          const tgtEdgeY = lineY < tgt.top ? tgt.top : tgt.bottom;
          const extX = sel.right < tgt.left ? tgt.left : tgt.right;
          addExtV(overlay, extX, lineY, tgtEdgeY);
        }
      }

      // Vertical gap
      if (sel.bottom < tgt.top || tgt.bottom < sel.top) {
        const lineX = hasXOverlap ? (xOverlapStart + xOverlapEnd) / 2 : sel.cx;
        const yFrom = sel.bottom < tgt.top ? sel.bottom : tgt.bottom;
        const yTo = sel.bottom < tgt.top ? tgt.top : sel.top;
        addVMeasure(overlay, lineX, yFrom, yTo);
        if (!hasXOverlap) {
          const tgtEdgeX = lineX < tgt.left ? tgt.left : tgt.right;
          const extY = sel.bottom < tgt.top ? tgt.top : tgt.bottom;
          addExtH(overlay, lineX, tgtEdgeX, extY);
        }
      }

      // Overlapping on both axes -> show edge-to-edge distances
      if (hasXOverlap && hasYOverlap) {
        if (Math.abs(sel.left - tgt.left) >= 1) addHMeasure(overlay, sel.left, tgt.left, sel.cy);
        if (Math.abs(sel.right - tgt.right) >= 1) addHMeasure(overlay, sel.right, tgt.right, sel.cy);
        if (Math.abs(sel.top - tgt.top) >= 1) addVMeasure(overlay, sel.cx, sel.top, tgt.top);
        if (Math.abs(sel.bottom - tgt.bottom) >= 1) addVMeasure(overlay, sel.cx, sel.bottom, tgt.bottom);
      }
    }

    const editorCanvasEl = document.getElementById('editor-canvas');
    editorCanvasEl.addEventListener('mousedown', () => {
      selectedSlotIdx = null;
      renderCanvas();
      syncInspector();
    });

    window.addEventListener('mousemove', (e) => {
      lastPointer = { clientX: e.clientX, clientY: e.clientY };
      isAltPressed = e.altKey;
      renderMeasureGuides();
    });
    editorCanvasEl.addEventListener('mouseleave', () => {
      lastPointer = null;
      renderMeasureGuides();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Alt' || e.altKey !== isAltPressed) {
        isAltPressed = e.altKey;
        renderMeasureGuides();
      }

      const tag = (document.activeElement?.tagName || '').toLowerCase();
      const inInput = tag === 'input' || tag === 'textarea' || tag === 'select';

      // Shortcuts (Undo/Redo, Copy/Paste, Zoom)
      if (!inInput && (e.metaKey || e.ctrlKey)) {
        const k = e.key.toLowerCase();
        if (k === 'z' && !e.shiftKey) {
          e.preventDefault();
          undo();
          return;
        }
        if ((k === 'z' && e.shiftKey) || (k === 'y' && e.ctrlKey)) {
          e.preventDefault();
          redo();
          return;
        }
        if (k === 'c') {
          e.preventDefault();
          copySelectedFrame();
          return;
        }
        if (k === 'v') {
          e.preventDefault();
          pasteFrame();
          return;
        }
        if (k === '=' || k === '+') {
          e.preventDefault();
          setZoom(zoomFactor + 0.15);
          return;
        }
        if (k === '-') {
          e.preventDefault();
          setZoom(zoomFactor - 0.15);
          return;
        }
        if (k === '0') {
          e.preventDefault();
          setZoom(1);
          return;
        }
      }

      // Arrow-key nudging (1px default, 10px with Shift)
      if (!inInput && currentLayout && selectedSlotIdx !== null && currentLayout.frames[selectedSlotIdx]) {
        const step = e.shiftKey ? 10 : 1;
        let dx = 0, dy = 0;
        if (e.key === 'ArrowLeft') dx = -step;
        else if (e.key === 'ArrowRight') dx = step;
        else if (e.key === 'ArrowUp') dy = -step;
        else if (e.key === 'ArrowDown') dy = step;
        if (dx !== 0 || dy !== 0) {
          e.preventDefault();
          const f = currentLayout.frames[selectedSlotIdx];
          f.x += dx;
          f.y += dy;
          renderCanvas();
          syncInspector();
          pushHistory();
        }
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'Alt' || e.altKey !== isAltPressed) {
        isAltPressed = e.altKey;
        renderMeasureGuides();
      }
    });
    window.addEventListener('blur', () => {
      isAltPressed = false;
      renderMeasureGuides();
    });

    document.getElementById('btn-zoom-out').onclick = () => setZoom(zoomFactor - 0.15);
    document.getElementById('btn-zoom-in').onclick = () => setZoom(zoomFactor + 0.15);
    document.getElementById('btn-zoom-reset').onclick = () => setZoom(1);
    document.getElementById('btn-copy-frame').onclick = copySelectedFrame;
    document.getElementById('btn-paste-frame').onclick = pasteFrame;
    document.getElementById('stage-wrap').addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.1 : -0.1;
        setZoom(zoomFactor + delta);
      }
    }, { passive: false });

    window.addEventListener('resize', renderCanvas);
    loadLayouts();
  </script>
</body>
</html>
